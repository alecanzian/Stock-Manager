<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stock Manager</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header>
    <h1>Stock Manager</h1>
    <button id="check">Check backend</button>
  </header>

  <main>
    <div class="left-column">
      <section class="card">
        <h2>Scanner</h2>
        <div class="scanner-wrapper">
          <video id="webcam" muted playsinline></video>
        </div>
      </section>

      <section class="card">
        <h2>Update stock</h2>
        <div class="form-grid">
          <div class="field full">
            <label for="item">Barcode</label>
            <input type="text" id="item" name="item">
          </div>
          <div class="field">
            <label for="amount">Quantity</label>
            <input type="number" id="amount" name="amount" min="0">
          </div>
          <div class="field">
            <label for="name">Name (only for new items)</label>
            <input type="text" id="name" name="name">
          </div>
        </div>
        <div class="button-row">
          <button id="add_button">Add</button>
          <button id="remove_button">Remove</button>
        </div>
        <div id="form_alert" class="alert"></div>
      </section>
    </div>

    <div class="right-column">
      <section class="card">
        <h2>Items</h2>
        <ul id="items"></ul>
      </section>
    </div>
  </main>

  <pre id="output"></pre>

  <script src="/config.js"></script>
  <script type="module" src="./index.js"></script>
</body>
</html>
